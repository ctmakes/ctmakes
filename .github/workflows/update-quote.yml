name: Update Daily Quote

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and update quote
        run: |
          response=$(curl -sf --retry 3 --max-time 20 https://ctmakes.com/api/quotes/random) || { echo "Quote API unreachable; leaving README unchanged"; exit 0; }
          quote=$(echo "$response" | jq -r '.quote // empty')
          author=$(echo "$response" | jq -r '.author // empty')
          if [ -z "$quote" ] || [ -z "$author" ]; then
            echo "Unexpected API response: $response"; exit 0
          fi

          # Replace content between QUOTE markers
          awk -v q="$quote" -v a="$author" '
            /<!-- QUOTE -->/ { print; print "*\"" q "\"* — " a; skip=1; next }
            /<!-- \/QUOTE -->/ { skip=0 }
            !skip { print }
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily quote"
          git push
